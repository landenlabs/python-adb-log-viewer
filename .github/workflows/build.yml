name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: android-log-viewer
          - os: windows-latest
            artifact: android-log-viewer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed main.py --name android-log-viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-log-viewer-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
