name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: android-log-viewer-macos.zip
            onefile_flag: ""
            icon_flag: --icon log-viewer.icns
            data_sep: ":"
            version_flag: ""
          - os: windows-latest
            artifact: android-log-viewer.exe
            onefile_flag: --onefile
            icon_flag: --icon log-viewer.ico
            data_sep: ";"
            version_flag: --version-file windows_version_info.py

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: >-
          pyinstaller
          ${{ matrix.onefile_flag }} --windowed
          --name android-log-viewer
          ${{ matrix.icon_flag }}
          ${{ matrix.version_flag }}
          --add-data "log-viewer.png${{ matrix.data_sep }}."
          --add-data "landen_labs_about_400.gif${{ matrix.data_sep }}."
          --add-data "bg-dark.jpg${{ matrix.data_sep }}."
          --add-data "bg-light.jpg${{ matrix.data_sep }}."
          adb-log-viewer.py

      # macOS --windowed always builds a .app bundle (onedir under the hood);
      # --onefile there is deprecated (PyInstaller warns) and produces a bare
      # executable with no Info.plist, so the Dock icon reverts once quit.
      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/android-log-viewer.app" "dist/android-log-viewer-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-log-viewer-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android-log-viewer-macos-latest/android-log-viewer-macos.zip
            artifacts/android-log-viewer-windows-latest/android-log-viewer.exe
